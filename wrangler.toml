# Cloudflare Worker für die Such-API (deployt per .github/workflows/deploy.yml)
name = "skysearch-api"
main = "worker.js"
compatibility_date = "2024-09-01"
workers_dev = true

[vars]
# Nur die eigene Seite darf die API (und damit das SerpAPI-Kontingent) nutzen.
# Bei eigener Domain für GitHub Pages hier ergänzen (kommagetrennt).
ALLOWED_ORIGINS = "https://henryai-stack.github.io"
# Repo und Workflow, die der Cron-Trigger täglich startet (Deals aktualisieren).
GH_REPO = "HenryAI-stack/flights"
GH_WORKFLOW = "deploy.yml"

# Zuverlässiger als GitHubs eigener Zeitplan: Cloudflare startet den Deploy täglich
# um 05:17 UTC (benötigt das Worker-Secret GH_DISPATCH_TOKEN).
[triggers]
crons = ["17 5 * * *"]
